
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      background: white;
      width: 100%;
      max-width: 500px;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }

    input[type="text"]:focus {
      border-color: #667eea;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 10px;
      transition: 0.2s;
    }

    .add-btn {
      background: #667eea;
      color: white;
      padding: 0 18px;
      font-size: 16px;
    }

    .add-btn:hover {
      background: #5267d5;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .filter-btn {
      padding: 8px 15px;
      background: #f1f1f1;
      color: #555;
    }

    .filter-btn.active {
      background: #667eea;
      color: white;
    }

    ul {
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px;
      background: #f8f9ff;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    .task-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      color: #333;
      word-break: break-word;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #999;
    }

    .delete-btn {
      background: #ff5c5c;
      color: white;
      padding: 7px 10px;
    }

    .delete-btn:hover {
      background: #e94444;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 20px;
    }

    .footer {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #777;
      font-size: 14px;
    }

    .clear-btn {
      background: transparent;
      color: #667eea;
      font-size: 14px;
    }

    .clear-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="app">
    <h1>📝 My To-Do List</h1>
    <p class="subtitle">Organize your day and get things done!</p>

    <div class="input-area">
      <input type="text" id="taskInput" placeholder="Enter a new task..." />
      <button class="add-btn" onclick="addTask()">+ Add</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
      <button class="filter-btn" onclick="setFilter('completed', this)">Completed</button>
    </div>

    <ul id="taskList"></ul>

    <div class="footer">
      <span id="taskCount">0 tasks left</span>
      <button class="clear-btn" onclick="clearCompleted()">Clear Completed</button>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("todoTasks")) || [];
    let currentFilter = "all";

    function saveTasks() {
      localStorage.setItem("todoTasks", JSON.stringify(tasks));
    }

    function addTask() {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();

      if (text === "") {
        alert("Please enter a task!");
        return;
      }

      tasks.push({
        id: Date.now(),
        text: text,
        completed: false
      });

      input.value = "";
      saveTasks();
      renderTasks();
    }

    // Add task by pressing Enter
    document.getElementById("taskInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        addTask();
      }
    });

    function toggleTask(id) {
      tasks = tasks.map(task =>
        task.id === id
          ? { ...task, completed: !task.completed }
          : task
      );

      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      saveTasks();
      renderTasks();
    }

    function setFilter(filter, button) {
      currentFilter = filter;

      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");
      renderTasks();
    }

    function clearCompleted() {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      renderTasks();
    }

    function renderTasks() {
      const list = document.getElementById("taskList");
      list.innerHTML = "";

      let filteredTasks = tasks;

      if (currentFilter === "active") {
        filteredTasks = tasks.filter(task => !task.completed);
      } else if (currentFilter === "completed") {
        filteredTasks = tasks.filter(task => task.completed);
      }

      if (filteredTasks.length === 0) {
        list.innerHTML = '<li class="empty">No tasks found 😊</li>';
      }

      filteredTasks.forEach(task => {
        const li = document.createElement("li");
        li.className = "task-item" + (task.completed ? " completed" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.onchange = () => toggleTask(task.id);

        const span = document.createElement("span");
        span.className = "task-text";
        span.textContent = task.text;

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "Delete";
        deleteBtn.onclick = () => deleteTask(task.id);

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteBtn);

        list.appendChild(li);
      });

      const remaining = tasks.filter(task => !task.completed).length;
      document.getElementById("taskCount").textContent =
        remaining + (remaining === 1 ? " task left" : " tasks left");
    }

    renderTasks();
  </script>

</body>
</html>
